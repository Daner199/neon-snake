server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas a la API van al contenedor "api"
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Vue Router: cualquier ruta (/jugar/arena, /ranking...) carga index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
